<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#103b32"><title>짠! 소주 따르기</title>
<style>
:root{font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;color:#effff8;background:#092b25}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 30%,#205e4c,#092b25 80%);overflow-x:hidden}button,input{font:inherit}button{border:0;border-radius:15px;padding:13px 17px;background:#b5f2ce;color:#123a2b;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#305d51;color:white}.wrap{max-width:560px;margin:auto;padding:20px}.panel{background:#ffffff12;border:1px solid #ffffff24;border-radius:22px;padding:19px;margin:12px 0;backdrop-filter:blur(8px)}h1{font-size:30px;margin:8px 0}h2{font-size:20px;margin:0 0 10px}.sub{opacity:.8;font-size:14px;line-height:1.6}.actions{display:flex;gap:9px;flex-wrap:wrap}input{min-width:0;width:100%;padding:14px;background:#fff;color:#123;border:0;border-radius:12px;font-size:20px;letter-spacing:3px;text-transform:uppercase}label{display:block;margin:12px 0 6px;font-size:14px}.hidden{display:none!important}.status{padding:9px 12px;border-radius:12px;background:#0003;margin:12px 0;font-size:14px;min-height:38px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.room{font-weight:900;letter-spacing:2px;color:#b5f2ce}.stage{position:relative;height:min(61dvh,520px);min-height:310px;overflow:hidden;border-radius:24px;background:linear-gradient(#194a40,#0c302a);border:1px solid #ffffff24;touch-action:none}.stage:after{content:'';position:absolute;bottom:18px;left:5%;width:90%;height:5px;background:#ffffff26;border-radius:8px}.hint{position:absolute;top:13px;left:12px;right:12px;text-align:center;color:#c7e4d8;font-size:13px;pointer-events:none}.bottle{position:absolute;width:min(74%,300px);height:88%;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 10px 12px #0006)}.bottle .cap{position:absolute;top:0;left:36%;width:28%;height:14%;background:#d9e9db;border-radius:5px 5px 2px 2px}.bottle .neck{position:absolute;top:10%;left:35%;width:30%;height:25%;background:#76b59b;border-radius:6px}.bottle .body{position:absolute;top:29%;left:5%;width:90%;height:69%;background:linear-gradient(90deg,#257f65,#58b38c 55%,#24765f);border:3px solid #9dd2b3;border-radius:23px 23px 17px 17px}.bottle .sticker{position:absolute;top:49%;left:14%;width:72%;height:29%;background:#e7f8d9;border-radius:12px;text-align:center;color:#18503e;padding-top:10px;font-size:21px;font-weight:900}.bottle .sticker small{display:block;font-size:11px}.spout{position:absolute;width:16px;height:16px;border:2px dashed #f4ffc5;background:#e8ffb566;border-radius:50%;z-index:4;touch-action:none}.glass{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);width:110px;height:128px;border:5px solid #d4f4ee;border-top:8px solid #e8fffb;border-radius:10px 10px 28px 28px;overflow:hidden;box-shadow:inset 0 0 15px #ffffff30,0 10px 15px #0003;touch-action:none}.liquid{position:absolute;bottom:0;left:0;right:0;height:0%;background:linear-gradient(#e6fcffbb,#c3f3ec99);transition:height .12s}.glass:after{content:'소주';position:absolute;left:0;right:0;top:45%;text-align:center;color:#fff9;font-weight:900;font-size:24px}.water{position:absolute;inset:0;pointer-events:none;z-index:3}.drop{position:absolute;width:7px;height:16px;background:#d6ffffd9;border-radius:50% 50% 55% 55%;animation:fall .55s linear forwards}@keyframes fall{from{transform:translateY(0);opacity:1}to{transform:translateY(220px);opacity:0}}.meter{height:12px;border-radius:12px;background:#ffffff2b;overflow:hidden;margin:10px 0}.fill{height:100%;width:0%;background:#b5f2ce;transition:width .15s}.stats{display:flex;justify-content:space-between;gap:8px;font-size:14px}.notice{font-size:12px;opacity:.7;line-height:1.5}.divider{height:1px;background:#ffffff24;margin:14px 0}
.cameraView{position:relative;margin-top:12px;border-radius:16px;overflow:hidden;background:#071c19;aspect-ratio:4/3}.cameraView video{width:100%;height:100%;object-fit:cover}.cameraTarget{position:absolute;left:50%;top:25%;width:90px;height:90px;transform:translate(-50%,-50%);border:3px dashed #b5f2ce;border-radius:50%;pointer-events:none}.cameraStatus{font-size:13px;margin-top:8px}.marker{position:absolute;right:12px;top:54px;background:#ff00ff;border:5px solid white;width:76px;height:76px;border-radius:50%;box-shadow:0 0 25px #ff00ff;z-index:5;pointer-events:none}</style></head><body><div class="wrap"><div class="top"><h1>🍶 짠! 소주 따르기</h1><span id="roomTag" class="room"></span></div><p class="sub">소주잔 폰은 왼쪽, 소주병 폰은 오른쪽에 고정하고 병을 기울여 잔을 채워보세요.</p>
<section id="setup" class="panel"><h2>게임 시작</h2><p class="sub">첫 번째 폰에서 방을 만들고, 두 번째 폰에서 방 코드로 입장하세요.</p><div class="actions"><button id="create">🍶 소주병으로 방 만들기</button></div><div class="divider"></div><label for="code">방 코드 입력</label><input id="code" maxlength="6" placeholder="예: ABC123" autocomplete="off"><div class="actions" style="margin-top:10px"><button id="join">🥃 소주잔으로 입장</button></div><p class="notice">Firebase 설정이 필요합니다. README.md를 참고하세요.</p></section>
<section id="game" class="hidden"><div class="panel"><div class="top"><h2 id="roleTitle">게임</h2><button id="leave" class="secondary">나가기</button></div><div id="status" class="status" role="status">연결 중...</div><div class="stats"><span id="angleText">기울기 0°</span><span id="score">0 / 100 ml</span></div><div class="meter"><div id="fill" class="fill"></div></div><div class="actions"><button id="sensor">📱 기울기 센서 켜기</button><button id="reverse" class="secondary">↔ 센서 방향 반대로</button><button id="pour" class="secondary">💧 테스트 따르기 (길게 누르기)</button><button id="reset" class="secondary">잔 비우기</button></div></div><div class="stage" id="stage"><div class="hint" id="hint"></div><div class="bottle hidden" id="bottle"><div class="cap"></div><div class="neck"></div><div class="body"></div><div class="sticker">소주<small>SOJU</small></div></div><div id="spout" class="spout hidden"></div><div class="glass hidden" id="glass"><div class="liquid" id="liquid"></div></div><div class="water" id="water"></div></div></section>
</div>
<script type="module">
// Firebase 콘솔 > 프로젝트 설정 > 내 앱 > 웹 앱에서 복사한 값으로 교체하세요.
const firebaseConfig = {
  apiKey: 'AIzaSyDZ5yKQ04FtJZv0AnzSmkfh75abdvMWPEk',
  authDomain: 'pp-game-2f9bd.firebaseapp.com',
  databaseURL: 'https://pp-game-2f9bd-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId: 'pp-game-2f9bd',
  appId: '1:163750713526:web:e455a77e4f705c86d92e17'
};
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getDatabase,ref,set,update,onValue,get,runTransaction,remove,onDisconnect} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
const $=id=>document.getElementById(id);let db,room='',role='',off=null,tilt=0,signedTilt=0,side=0,glassSide=1,sensorSign=1,sensorBaseGamma=null,sensorBaseBeta=0,manual=false,offset=0,amount=0,connected=false,glassX=.83,spoutX=.12,spoutY=.42,latest=null,lastTick=performance.now(),lastSend=0,lastPour=false,done=false;
const configured=!firebaseConfig.apiKey.startsWith('PASTE_')&&!firebaseConfig.databaseURL.includes('PASTE_');
try{if(configured)db=getDatabase(initializeApp(firebaseConfig));}catch(e){alert('Firebase 설정 오류: '+e.message)}
function msg(t){$('status').textContent=t}function rnd(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function r(){return ref(db,'sojuRooms/'+room)}
async function enter(which,code){if(!db){alert('index.html의 firebaseConfig를 먼저 설정해주세요.');return}try{room=code;role=which;const snap=await get(r());if(which==='bottle'){if(snap.exists())throw Error('이미 사용 중인 방 코드입니다. 다시 시도하세요.');await set(r(),{createdAt:Date.now(),bottleOnline:true,glassOnline:false,amount:0,pouring:false,aim:.5,tilt:0});}else{if(!snap.exists())throw Error('방을 찾을 수 없습니다.');if(snap.val().glassOnline)throw Error('이미 잔 플레이어가 들어와 있습니다.');await update(r(),{glassOnline:true});}const presenceRef=ref(db,`sojuRooms/${room}/${role==='bottle'?'bottleOnline':'glassOnline'}`);onValue(ref(db,'.info/connected'),async snap=>{if(!snap.val()||!room)return;try{await onDisconnect(presenceRef).set(false);await set(presenceRef,true);}catch(e){console.warn('Presence sync failed',e);msg('연결 상태 동기화 실패: '+e.message);}});$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('roomTag').textContent=room;$('roleTitle').textContent=role==='bottle'?'🍶 소주병':'🥃 소주잔';$('bottle').classList.toggle('hidden',role!=='bottle');$('spout').classList.toggle('hidden',role!=='bottle');$('glass').classList.toggle('hidden',role!=='glass');$('sensor').classList.toggle('hidden',role!=='bottle');$('pour').classList.toggle('hidden',role!=='bottle');$('hint').textContent=role==='bottle'?'잔은 왼쪽, 병은 오른쪽에 고정하고 병을 기울여 따르세요':'잔을 좌우로 드래그해 물줄기 받기';off=onValue(r(),s=>{if(!s.exists()){msg('방이 종료됐습니다.');return}latest=s.val();amount=latest.amount||0;connected=!!(latest.bottleOnline&&latest.glassOnline);$('score').textContent=`${Math.floor(amount)} / 100 ml`;$('fill').style.width=Math.min(100,amount)+'%';$('liquid').style.height=Math.min(100,amount)+'%';if(amount>=100){msg('🎉 짠! 가득 채웠어요!');done=true}else if(!connected){msg('상대방 접속을 기다리는 중... (병 '+(latest.bottleOnline?'접속':'미접속')+' / 잔 '+(latest.glassOnline?'접속':'미접속')+')')}else{msg(latest.pouring?'💧 소주 따르는 중!':'연결 완료! 소주병을 기울여 주세요.')}if(role==='glass')$('angleText').textContent=`기울기 ${Math.round(latest.tilt||0)}°`;});render();}catch(e){alert(e.message);room='';role='';}}
$('create').onclick=()=>enter('bottle',rnd());$('join').onclick=()=>{let c=$('code').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(c))return alert('6자리 방 코드를 입력해주세요.');enter('glass',c)};
$('leave').onclick=async()=>{if(db&&room){try{if(role==='bottle')await remove(r());else await update(r(),{glassOnline:false,pouring:false});}catch(e){console.warn(e)}}location.reload()};
$('reset').onclick=async()=>{if(room){await update(r(),{amount:0,pouring:false});done=false;}};

$('sensor').onclick=async()=>{try{if(typeof DeviceOrientationEvent==='undefined')throw Error('이 기기는 방향 센서를 지원하지 않습니다.');if(typeof DeviceOrientationEvent.requestPermission==='function'){const p=await DeviceOrientationEvent.requestPermission();if(p!=='granted')throw Error('센서 권한이 거부되었습니다.')}sensorBaseGamma=null;window.addEventListener('deviceorientation',e=>{if(e.gamma!=null){if(sensorBaseGamma===null){sensorBaseGamma=e.gamma;sensorBaseBeta=e.beta??0;}signedTilt=((e.gamma-sensorBaseGamma+540)%360)-180;tilt=Math.abs(signedTilt);side=e.beta==null?0:Math.max(-45,Math.min(45,(e.beta-sensorBaseBeta)));$('angleText').textContent=`기울기 ${Math.round(signedTilt)}° / 물줄기 좌우 ${Math.round(side)}°`; }},{passive:true});$('sensor').textContent='✅ 위치 세팅 완료 (다시 누르면 재보정)';}catch(e){alert(e.message+' 테스트 따르기 버튼을 사용할 수 있습니다.')}};
$('reverse').onclick=()=>{sensorSign*=-1;$('reverse').textContent=sensorSign===1?'↔ 센서 방향 반대로':'↔ 센서 방향 반전됨';};const test=$('pour');for(const evt of ['pointerdown','pointerup','pointercancel','pointerleave'])test.addEventListener(evt,e=>{manual=evt==='pointerdown';if(manual)test.setPointerCapture(e.pointerId)});
const stage=$('stage');let dragging='';stage.addEventListener('pointerdown',e=>{if(role==='glass'&&e.target.closest('#glass'))dragging='glass';if(dragging){stage.setPointerCapture(e.pointerId);move(e)}});stage.addEventListener('pointermove',e=>{if(dragging)move(e)});stage.addEventListener('pointerup',()=>dragging='');stage.addEventListener('pointercancel',()=>dragging='');function move(e){let b=stage.getBoundingClientRect();let x=Math.max(.08,Math.min(.92,(e.clientX-b.left)/b.width));if(dragging==='glass')glassX=x;render()}
function render(){let w=stage.clientWidth,h=stage.clientHeight;$('glass').style.left=glassX*100+'%';$('spout').style.left=spoutX*100+'%';$('spout').style.top=spoutY*100+'%';/* bottle stays visually fixed */}
function drops(x,y){let d=document.createElement('i');d.className='drop';d.style.left=x+'px';d.style.top=y+'px';$('water').appendChild(d);setTimeout(()=>d.remove(),560)}
async function tick(now){requestAnimationFrame(tick);let dt=Math.min(.1,(now-lastTick)/1000);lastTick=now;if(!room||!latest)return;let towardGlass=signedTilt*sensorSign*glassSide>28;let active=role==='bottle'&&(manual||towardGlass)&&connected&&!done;let aim=Math.max(.05,Math.min(.95,spoutX+offset+side*.008));if(role==='bottle'){/* physical phone tilts, not the bottle drawing */if(now-lastSend>120){lastSend=now;update(r(),{pouring:active,aim,tilt:manual?55:tilt}).catch(()=>{});}if(active&&Math.random()<.65)drops(stage.clientWidth*aim,stage.clientHeight*spoutY)}else{if(latest.pouring&&Math.random()<.7)drops(stage.clientWidth*(latest.aim||.5),stage.clientHeight*.10);if(latest.pouring&&connected&&amount<100){const hit=Math.abs((latest.aim||.5)-glassX)<(110/stage.clientWidth)/2; if(hit&&now-lastSend>150){lastSend=now;runTransaction(ref(db,'sojuRooms/'+room+'/amount'),v=>Math.min(100,(v||0)+1.2),{applyLocally:false}).catch(()=>{});}}}}
requestAnimationFrame(tick);
</script></body></html>
