 const dropMat=new THREE.MeshPhysicalMaterial({color:0xc7ffff,roughness:.08,metalness:0,transparent:true,opacity:.85});
 const drops3d=Array.from({length:42},()=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.052,8,8),dropMat);m.scale.set(.7,1.8,.7);scene.add(m);return m});
 const streamMat=new THREE.MeshBasicMaterial({color:0xb4f8ff,transparent:true,opacity:.58,depthWrite:false});
 const stream=new THREE.Mesh(new THREE.BufferGeometry(),streamMat);scene.add(stream);const splashMat=new THREE.MeshBasicMaterial({color:0xdfffff,transparent:true,opacity:.7,depthWrite:false});const splashes=Array.from({length:16},()=>{const p=new THREE.Mesh(new THREE.SphereGeometry(.025,6,6),splashMat);scene.add(p);return p});
 visual3d={renderer,scene,camera,bottle,capPivot,bottleLiquid,bottleSurface,glassGroup,liquid,surface,drops3d,stream,splashes};

}
function animate3D(now,active,aim){
 const v=visual3d;if(!v)return;
 const {renderer,scene,camera,bottle,capPivot,bottleLiquid,bottleSurface,glassGroup,liquid,surface,drops3d,stream,splashes}=v;
 const h=stage.clientHeight,w=stage.clientWidth;
 bottle.visible=role==='bottle';glassGroup.visible=role==='glass';
 const time=now*.001;
 if(role==='bottle'){
  bottle.position.set(0,-.15,0);bottle.rotation.set(0,touchRotationY,0);
  const openAmount=capOpen?1:0;
  capPivot.rotation.z=THREE.MathUtils.lerp(capPivot.rotation.z,openAmount*-.65,.09);
  capPivot.position.y=THREE.MathUtils.lerp(capPivot.position.y,1.72+openAmount*.9,.09);
  capPivot.position.x=THREE.MathUtils.lerp(capPivot.position.x,openAmount*.45,.09);
  capPivot.rotation.y+=capOpen?.025:-capPivot.rotation.y*.08;
  const remaining=Math.max(.04,1-amount/100),height=2.1*remaining;
  bottleLiquid.scale.y=height;bottleLiquid.position.y=-1.92+height/2;
  bottleSurface.position.y=-1.92+height;
  liquidSway=THREE.MathUtils.lerp(liquidSway,THREE.MathUtils.clamp(-signedTilt*.009,-.28,.28),.045);
  bottleSurface.rotation.set(-Math.PI/2+liquidSway*.7,Math.sin(time*4)*.06,Math.sin(time*5)*.09+liquidSway);
  bottleLiquid.rotation.z=liquidSway*.13;
  bottleSurface.scale.setScalar(.98+Math.sin(time*6)*.015);
 }else{
  const visibleH=2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*camera.position.z;
  glassGroup.position.set((glassX-.5)*visibleH*(w/h),-visibleH*.28,0);
  const level=Math.max(.012,Math.min(1,amount/100))*1.72;
  liquid.scale.y=level;liquid.position.y=level/2+.08;
  surface.position.y=level+.08;
 }
 const pouring=role==='bottle'?active:!!latest?.pouring;
 const visibleH=2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*camera.position.z;
 const x=role==='glass'?(aim-.5)*visibleH*(w/h):0;
 const top=role==='glass'?visibleH*.54:1.98;
 const bottom=role==='glass'?glassGroup.position.y+1.7:-.3;
 const length=Math.max(.4,top-bottom);
 const speed=3.6,phase=time*speed;
 // A tapered, gently wandering stream whose surface ripples downwards.
 stream.visible=pouring;
 if(pouring){
  const count=48,around=8,vertices=[],normals=[],indices=[];
  for(let j=0;j<=count;j++){
   const t=j/count,y=top-length*t;
   const centerX=x+(role==='bottle'?.2*t*t:0)+Math.sin(t*16-phase*2)*(.014+.02*t);
   const centerZ=.4+Math.cos(t*13-phase*1.7)*.014;
   const radius=(.046-.024*t)*(1+.14*Math.sin(t*55-phase*10));
   for(let k=0;k<around;k++){
    const a=k*Math.PI*2/around;
    vertices.push(centerX+Math.cos(a)*radius,y,centerZ+Math.sin(a)*radius);
    normals.push(Math.cos(a),0,Math.sin(a));
    if(j<count){const n=j*around+k,next=j*around+(k+1)%around;indices.push(n,next,n+around,next,next+around,n+around)}
   }
  }
  const geometry=new THREE.BufferGeometry();
  geometry.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
  geometry.setAttribute('normal',new THREE.Float32BufferAttribute(normals,3));
  geometry.setIndex(indices);
  stream.geometry.dispose();stream.geometry=geometry;
 }
 drops3d.forEach((d,i)=>{
  d.visible=pouring;if(!pouring)return;
  const t=((phase*.62+i/42)%1);
  const breakaway=t>.62;
  d.visible=breakaway||i%7===0;
  const lateral=role==='bottle'?.2*t*t:0;
  d.position.set(x+lateral+Math.sin(i*13.7+phase)*(.02+.05*t),top-length*t,.42);
  const scale=breakaway?.5+.45*t:.3;
  d.scale.set(scale,scale*(1.6+Math.sin(i+phase)*.3),scale);
 });
 splashes.forEach((p,i)=>{
  const impact=role==='glass'&&pouring&&Math.abs(x-glassGroup.position.x)<1;
  p.visible=impact;if(!impact)return;
  const t=(time*2.7+i*.173)%1,a=i*2.39996;
  p.position.set(x+Math.cos(a)*t*.35,bottom+Math.sin(t*Math.PI)*.25,.45+Math.sin(a)*t*.22);
  p.scale.setScalar((1-t)*(.8+((i*7)%5)*.15));
 });
 renderer.render(scene,camera);
}

function drops(x,y){let d=document.createElement('i');d.className='drop';d.style.left=x+'px';d.style.top=y+'px';$('water').appendChild(d);setTimeout(()=>d.remove(),560)}
async function tick(now){requestAnimationFrame(tick);lastTick=now;if(!room||!latest)return;let towardGlass=signedTilt*sensorSign*glassSide>28;let active=role==='bottle'&&(manual||towardGlass)&&connected&&!done;if(active&&!capOpen){capOpen=true;capOpenedAt=now;$('openCap').textContent='🍾 뚜껑 닫기';}let aim=Math.max(.05,Math.min(.95,spoutX+side*.008));animate3D(now,active,aim);if(role==='bottle'){$('stream').classList.add('hidden');/* physical phone tilts, not the bottle drawing */if(now-lastSend>120){lastSend=now;update(r(),{pouring:active,aim,tilt:manual?55:tilt}).catch(()=>{});}if(active&&Math.random()<.65)drops(stage.clientWidth*aim,stage.clientHeight*spoutY)}else{const stream=$('stream');stream.classList.toggle('hidden',!latest.pouring);if(latest.pouring){stream.style.left=`calc(${(latest.aim??.5)*100}% - 4px)`;stream.style.top='0';stream.style.height='72%';if(Math.random()<.7)drops(stage.clientWidth*(latest.aim??.5),stage.clientHeight*.45);}if(latest.pouring&&connected&&amount<100){const hit=Math.abs((latest.aim??.5)-glassX)<($('glass').offsetWidth/stage.clientWidth)/2; if(hit&&now-lastSend>150){lastSend=now;runTransaction(ref(db,'sojuRooms/'+room+'/amount'),v=>Math.min(100,(v||0)+1.2),{applyLocally:false}).catch(()=>{});}}}}
